name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck client
        run: npx tsc --noEmit -p client/tsconfig.json

      - name: Typecheck server
        run: npx tsc --noEmit -p server/tsconfig.json

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build server image
        run: docker build -f server/Dockerfile -t clientportal365-server .

      - name: Build client image
        run: docker build -f client/Dockerfile -t clientportal365-client .
